# Builds both images from source. Usage:
#   cp .env.example .env   # set COOKIE_SECURE=false for http://localhost
#   docker compose -f docker-compose-local.yml up --build
services:
  osrs_tracker_frontend:
    build:
      context: ./site
    environment:
      - HOST_URL=${HOST_URL:-http://osrs_tracker_backend:8080}
      - SITE_TITLE=${SITE_TITLE:-OSRS Guild Map}
      - SITE_NAME=${SITE_NAME:-OSRS Guild Map}
    restart: unless-stopped
    depends_on:
      - osrs_tracker_backend
    ports:
      - 4000:4000
  osrs_tracker_backend:
    build:
      context: ./server
    env_file: .env
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - 5000:8080
    extra_hosts:
      - host.docker.internal:host-gateway # lets HUB_BASE_URL point at a hub or mock hub on the host
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB:-osrs_tracker}
    ports:
      - 5432:5432
    volumes:
      - ./pg-data:/var/lib/postgresql/data
