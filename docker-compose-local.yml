# Builds both images from source. Usage:
#   cp .env.example .env   # set COOKIE_SECURE=false for http://localhost
#   docker compose -f docker-compose-local.yml up --build
#
# Against the mock hub on the host (tools/mock-hub/server.js), which also stands in for Discord, the
# backend reaches it as host.docker.internal and the browser as localhost:
#   HUB_BASE_URL=http://host.docker.internal:7070
#   DISCORD_API_BASE=http://host.docker.internal:7070/discord
#   DISCORD_AUTHORIZE_URL=http://localhost:7070/discord/oauth2/authorize
services:
  osrs_tracker_frontend:
    build:
      context: ./site
    environment:
      - HOST_URL=${HOST_URL:-http://osrs_tracker_backend:8080}
      - SITE_TITLE=${SITE_TITLE:-OSRS Guild Map}
      - SITE_NAME=${SITE_NAME:-OSRS Guild Map}
      - ICONS_BASE_URL # unset uses the default CDN; empty turns icons off
    restart: unless-stopped
    depends_on:
      - osrs_tracker_backend
    ports:
      - 4000:4000
  osrs_tracker_backend:
    build:
      context: ./server
    env_file: .env
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - 5080:8080 # Windows often reserves port 5000
    extra_hosts:
      - host.docker.internal:host-gateway # lets HUB_BASE_URL point at a hub or mock hub on the host
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB:-osrs_tracker}
    ports:
      - 55432:5432 # a local osrs-data-hub database usually has 5432
    volumes:
      - ./pg-data:/var/lib/postgresql/data
