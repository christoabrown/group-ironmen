<div class="map-page__container">
  <div class="map-page__focus-player-buttons"></div>
  <div class="map-page__trail-controls men-control-container rsborder-tiny rsbackground" hidden>
    <select class="map-page__trail-player" aria-label="Show a player's trail">
      <option value="">Trail: off</option>
    </select>
    <select class="map-page__trail-days" aria-label="Trail length">
      <option value="1">24 hours</option>
      <option value="7">7 days</option>
      <option value="30">30 days</option>
    </select>
    <span class="map-page__trail-status"></span>
  </div>
  <div class="men-control-container rsborder-tiny rsbackground rsbackground-hover">
    <select class="map-page__plane-select">
      <option value="1">Plane: 1</option>
      <option value="2">Plane: 2</option>
      <option value="3">Plane: 3</option>
      <option value="4">Plane: 4</option>
    </select>
  </div>
</div>
