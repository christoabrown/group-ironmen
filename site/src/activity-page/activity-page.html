<h3 class="activity-page__heading">Activity</h3>

<section class="activity-page__section rsborder-tiny rsbackground">
  <div class="activity-page__section-header">
    <h4>Top gainers</h4>
    <div class="activity-page__controls">
      <select class="activity-page__gains-period" aria-label="Period">
        <option value="day">Today</option>
        <option value="week">This week</option>
        <option value="month">This month</option>
      </select>
      <select class="activity-page__gains-skill" aria-label="Skill"></select>
    </div>
  </div>
  <ol class="activity-page__gains"></ol>
  <div class="activity-page__gains-status activity-page__status"></div>
</section>

<section class="activity-page__section rsborder-tiny rsbackground">
  <div class="activity-page__section-header">
    <h4>Recent events</h4>
  </div>
  <event-feed filters></event-feed>
</section>
