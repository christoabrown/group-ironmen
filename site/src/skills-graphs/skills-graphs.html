<div class="skills-graphs__control-container">
  <button class="skills-graphs__refresh rs-button">Refresh</button>

  <div class="skills-graphs__period-toggle">
    <button class="rs-button small skills-graphs__period-btn active" data-period="Day">24H</button>
    <button class="rs-button small skills-graphs__period-btn" data-period="Week">7D</button>
    <button class="rs-button small skills-graphs__period-btn" data-period="Month">30D</button>
    <button class="rs-button small skills-graphs__period-btn" data-period="Year">1Y</button>
  </div>

  <div class="rs-control-container rsborder-tiny rsbackground rsbackground-hover">
    <select class="skills-graphs__skill-select">
      ${skillNames.map((skillName) => `
      <option value="${skillName}">${skillName}</option>
      `).join('')}
    </select>
  </div>
</div>
<div class="skills-graphs__picker">
  <div class="skills-graphs__chips"></div>
  <input
    type="search"
    class="skills-graphs__player-search input-small"
    list="skills-graphs__player-options"
    placeholder="Add player..."
    aria-label="Add a player to the graph"
    disabled
  />
  <datalist id="skills-graphs__player-options"></datalist>
  <span class="skills-graphs__picker-hint"></span>
</div>
<div class="skills-graphs__chart-container rsborder rsbackground"></div>
