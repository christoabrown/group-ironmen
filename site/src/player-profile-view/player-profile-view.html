<div class="player-profile-view__panel rsborder rsbackground">
  <header class="player-profile-view__header">
    <div class="player-profile-view__title">
      <span class="player-profile-view__dot"></span>
      <h3 class="player-profile-view__name"></h3>
      <span class="player-profile-view__badge"></span>
      <button type="button" class="player-profile-view__close" aria-label="Close">&times;</button>
    </div>
    <div class="player-profile-view__status"></div>
    <div class="player-profile-view__details"></div>
    <div class="player-profile-view__actions">
      <button type="button" class="men-button small player-profile-view__follow">Follow on map</button>
      <button type="button" class="men-button small player-profile-view__trail" hidden>Show trail</button>
    </div>
  </header>
  <nav class="player-profile-view__tabs" aria-label="Profile sections"></nav>
  <div class="player-profile-view__body"></div>
</div>
